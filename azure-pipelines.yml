
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'AzureServiceConnection'
  resourceGroup: 'rg-aks-production'
  aksClusterName: 'aks-production'
  namespace: 'production'

steps:

# ============================================================
# 1. Verify Azure Authentication and Subscription
# ============================================================

- task: AzureCLI@2
  displayName: 'Verify Azure Authentication'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      set -euo pipefail

      echo "========================================="
      echo "Azure Authentication"
      echo "========================================="

      az account show \
        --query "{Name:name, Subscription:id, Tenant:tenantId}" \
        --output table

      echo "Azure subscription verified successfully."


# ============================================================
# 2. Install Tools and Connect to AKS
# ============================================================

- task: AzureCLI@2
  displayName: 'Install Tools and Connect to AKS'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      set -euo pipefail

      echo "========================================="
      echo "Installing kubectl and kubelogin"
      echo "========================================="

      az aks install-cli

      export PATH="/usr/local/bin:$PATH"

      kubectl version --client
      kubelogin --version

      echo "========================================="
      echo "Getting AKS credentials"
      echo "========================================="

      az aks get-credentials \
        --resource-group "$(resourceGroup)" \
        --name "$(aksClusterName)" \
        --overwrite-existing

      echo "========================================="
      echo "Configuring kubelogin"
      echo "========================================="

      kubelogin convert-kubeconfig -l azurecli

      echo "========================================="
      echo "Testing AKS connection"
      echo "========================================="

      kubectl config current-context

      kubectl get nodes

      echo "AKS connection successful."


# ============================================================
# 3. Create Production Namespace
# ============================================================

- task: AzureCLI@2
  displayName: 'Create Production Namespace'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      set -euo pipefail

      echo "========================================="
      echo "Creating production namespace"
      echo "========================================="

      kubectl create namespace "$(namespace)" \
        --dry-run=client \
        -o yaml | kubectl apply -f -

      kubectl get namespaces


# ============================================================
# 4. Deploy Kubernetes Manifests
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy Kubernetes Manifests'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      set -euo pipefail

      MANIFEST_DIR="$(System.DefaultWorkingDirectory)/kubernetes"

      echo "========================================="
      echo "Checking Kubernetes manifest directory"
      echo "========================================="

      if [ ! -d "$MANIFEST_DIR" ]; then
        echo "ERROR: Kubernetes directory not found."
        exit 1
      fi

      ls -la "$MANIFEST_DIR"

      echo "========================================="
      echo "Applying Kubernetes manifests"
      echo "========================================="

      kubectl apply -f "$MANIFEST_DIR/"

      echo "========================================="
      echo "Checking deployments"
      echo "========================================="

      kubectl get deployments -n "$(namespace)"

      echo "========================================="
      echo "Checking pods"
      echo "========================================="

      kubectl get pods -n "$(namespace)"

      echo "========================================="
      echo "Checking services"
      echo "========================================="

      kubectl get services -n "$(namespace)"

      echo "========================================="
      echo "Checking HPA"
      echo "========================================="

      kubectl get hpa -n "$(namespace)" || true


# ============================================================
# 5. Verify Application Deployment
# ============================================================

- task: AzureCLI@2
  displayName: 'Verify AKS Application Deployment'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      set -euo pipefail

      echo "========================================="
      echo "Waiting for deployment rollout"
      echo "========================================="

      kubectl rollout status deployment/webapp \
        -n "$(namespace)" \
        --timeout=180s

      echo "========================================="
      echo "Final Kubernetes Resources"
      echo "========================================="

      kubectl get all -n "$(namespace)"

      echo "========================================="
      echo "Final Pod Status"
      echo "========================================="

      kubectl get pods -n "$(namespace)" -o wide

      echo "========================================="
      echo "AKS Deployment Completed Successfully"
      echo "========================================="
