
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'AzureServiceConnection'
  resourceGroup: 'rg-aks-production'
  aksClusterName: 'aks-production'
  namespace: 'production'

  # Replace with your existing image
  dockerHubUsername: 'YOUR_DOCKERHUB_USERNAME'
  dockerImageName: 'webapp'
  dockerImageTag: 'latest'

steps:

# ============================================================
# 1. Verify Azure Authentication
# ============================================================

- task: AzureCLI@2
  displayName: 'Verify Azure Authentication'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -euo pipefail

      echo "Verifying Azure authentication"

      az account show --output table

      echo "Azure authentication successful"


# ============================================================
# 2. Install kubectl and kubelogin
# ============================================================

- task: AzureCLI@2
  displayName: 'Install Tools and Connect to AKS'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -euo pipefail

      echo "Installing kubectl and kubelogin"

      az aks install-cli

      export PATH="/usr/local/bin:$PATH"

      kubectl version --client

      kubelogin --version

      echo "Getting AKS credentials"

      az aks get-credentials \
        --resource-group "$(resourceGroup)" \
        --name "$(aksClusterName)" \
        --overwrite-existing

      echo "Configuring kubelogin"

      kubelogin convert-kubeconfig -l azurecli

      echo "Checking AKS connection"

      kubectl config current-context

      echo "AKS connection configured successfully"


# ============================================================
# 3. Verify Production Namespace and Permissions
# ============================================================

- task: AzureCLI@2
  displayName: 'Verify Production Namespace'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -euo pipefail

      echo "Checking production namespace"

      kubectl get namespace "$(namespace)"

      echo "Checking deployment permissions"

      kubectl auth can-i get deployments \
        -n "$(namespace)"

      kubectl auth can-i create deployments \
        -n "$(namespace)"

      echo "Namespace verification completed"


# ============================================================
# 4. Validate Kubernetes Manifests
# ============================================================

- task: AzureCLI@2
  displayName: 'Validate Kubernetes Manifests'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -euo pipefail

      MANIFEST_DIR="$(Build.SourcesDirectory)/kubernetes"

      echo "Checking Kubernetes directory"

      if [ ! -d "$MANIFEST_DIR" ]; then
        echo "ERROR: Kubernetes directory not found"
        exit 1
      fi

      ls -la "$MANIFEST_DIR"

      echo "Validating deployment manifest"

      kubectl apply \
        --dry-run=server \
        -f "$MANIFEST_DIR/deployment.yaml" \
        -n "$(namespace)"

      echo "Validating service manifest"

      kubectl apply \
        --dry-run=server \
        -f "$MANIFEST_DIR/service.yaml" \
        -n "$(namespace)"

      echo "Validating HPA manifest"

      kubectl apply \
        --dry-run=server \
        -f "$MANIFEST_DIR/hpa.yaml" \
        -n "$(namespace)"

      echo "Manifest validation successful"


# ============================================================
# 5. Deploy Kubernetes Manifests
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy Kubernetes Application'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -euo pipefail

      MANIFEST_DIR="$(Build.SourcesDirectory)/kubernetes"

      echo "Deploying application"

      kubectl apply \
        -f "$MANIFEST_DIR/deployment.yaml" \
        -n "$(namespace)"

      echo "Updating application image"

      IMAGE="$(dockerHubUsername)/$(dockerImageName):$(dockerImageTag)"

      kubectl set image deployment/webapp \
        webapp="$IMAGE" \
        -n "$(namespace)"

      echo "Applying Kubernetes service"

      kubectl apply \
        -f "$MANIFEST_DIR/service.yaml" \
        -n "$(namespace)"

      echo "Applying Horizontal Pod Autoscaler"

      kubectl apply \
        -f "$MANIFEST_DIR/hpa.yaml" \
        -n "$(namespace)"

      echo "Kubernetes manifests deployed"


# ============================================================
# 6. Verify Application Deployment
# ============================================================

- task: AzureCLI@2
  displayName: 'Verify AKS Deployment'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      set -euo pipefail

      echo "Waiting for deployment rollout"

      kubectl rollout status deployment/webapp \
        -n "$(namespace)" \
        --timeout=180s

      echo "Checking deployment"

      kubectl get deployments -n "$(namespace)"

      echo "Checking pods"

      kubectl get pods -n "$(namespace)" -o wide

      echo "Checking services"

      kubectl get services -n "$(namespace)"

      echo "Checking HPA"

      kubectl get hpa -n "$(namespace)"

      echo "Checking Kubernetes resources"

      kubectl get all -n "$(namespace)"

      echo "AKS deployment completed successfully"
