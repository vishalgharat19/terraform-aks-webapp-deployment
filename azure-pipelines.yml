
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'AzureServiceConnection'
  resourceGroup: 'rg-aks-production'
  aksClusterName: 'aks-production'
  namespace: 'production'

steps:

# ============================================================
# 1. Install tools, authenticate and connect to AKS
# ============================================================

- task: AzureCLI@2
  displayName: 'Connect to AKS and deploy application'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |

      set -euo pipefail

      echo "========================================="
      echo "Azure Account Information"
      echo "========================================="

      az account show \
        --query "{Name:name, Subscription:id, Tenant:tenantId}" \
        --output table

      echo "========================================="
      echo "Installing kubectl and kubelogin"
      echo "========================================="

      az aks install-cli

      kubectl version --client
      kubelogin --version

      echo "========================================="
      echo "Getting AKS credentials"
      echo "========================================="

      az aks get-credentials \
        --resource-group "$(resourceGroup)" \
        --name "$(aksClusterName)" \
        --overwrite-existing

      echo "========================================="
      echo "Configuring kubelogin"
      echo "========================================="

      kubelogin convert-kubeconfig -l azurecli

      echo "========================================="
      echo "Testing AKS connection"
      echo "========================================="

      kubectl config current-context
      kubectl get nodes

      echo "========================================="
      echo "Creating production namespace"
      echo "========================================="

      kubectl create namespace "$(namespace)" \
        --dry-run=client -o yaml | kubectl apply -f -

      echo "========================================="
      echo "Checking Kubernetes manifests"
      echo "========================================="

      ls -la "$(System.DefaultWorkingDirectory)/kubernetes"

      echo "========================================="
      echo "Applying Kubernetes manifests"
      echo "========================================="

      kubectl apply \
        -f "$(System.DefaultWorkingDirectory)/kubernetes/"

      echo "========================================="
      echo "Checking deployments"
      echo "========================================="

      kubectl get deployments -n "$(namespace)"

      echo "========================================="
      echo "Checking pods"
      echo "========================================="

      kubectl get pods -n "$(namespace)"

      echo "========================================="
      echo "Checking services"
      echo "========================================="

      kubectl get services -n "$(namespace)"

      echo "========================================="
      echo "Checking HPA"
      echo "========================================="

      kubectl get hpa -n "$(namespace)" || true

      echo "========================================="
      echo "AKS deployment completed"
      echo "========================================="
 
